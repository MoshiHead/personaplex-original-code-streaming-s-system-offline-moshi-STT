[project]
name = "moshi-personaplex"
requires-python = ">= 3.10"
description = "Personaplex finetune of moshi to enable role and voice control."
dependencies = [
    "numpy >= 1.26, < 2.2",
    "safetensors >= 0.4.0, < 0.5",
    "huggingface-hub >= 0.24, < 0.25",
    "einops == 0.7",
    "sentencepiece == 0.2",
    "sounddevice == 0.5",
    "sphn >= 0.1.4, < 0.2",
    "torch >= 2.2.0, < 2.5",
    "aiohttp>=3.10.5, <3.11",
    # RAG: local knowledge retrieval (embedding model + index search)
    "sentence-transformers >= 3.0",
    # RAG: STT transcription model + the ContextCompressor grounding LLM
    "transformers >= 4.44",
    "accelerate >= 0.33",
    "bitsandbytes >= 0.45",
    # LoRA: moshi/lora adapter loading
    "peft >= 0.13",
]
authors = [{name="Rajarshi Roy", email="rajarshir@nvidia.com"}]
maintainers = [{name="Rajarshi Roy", email="rajarshir@nvidia.com"}]
license = {text = "MIT"}
dynamic = ["version"]
readme = "README.md"

[project.scripts]
moshi-server = "moshi.server:main"
moshi-offline = "moshi.offline:main"

[tool.setuptools.packages.find]
# Without this, setuptools' flat-layout auto-discovery sees `moshi/lora/` (the LoRA adapter directory,
# a sibling of `moshi/moshi/` under this pyproject.toml's root) as a second top-level package named "lora"
# and refuses to build at all ("Multiple top-level packages discovered in a flat-layout: ['lora', 'moshi']").
# Restricting discovery to the moshi* family excludes lora/ (and any other non-package directory that might
# show up here later, e.g. checkpoints/) without needing to enumerate submodules by hand.
include = ["moshi*"]

[tool.setuptools.dynamic]
version = {attr = "moshi.__version__"}

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"